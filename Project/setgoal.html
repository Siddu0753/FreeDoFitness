<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Goal - FreeDo Fitness</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1583454110558-bb62a2a27b39?auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
      color: #fff;
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 500px;
      margin: auto;
      padding: 40px;
      text-align: center;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      color: #f1c40f;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #e74c3c;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Set Your Goal</h1>

    <label for="goal">Choose Your Fitness Goal</label>
    <select id="goal">
      <option value="">-- Select --</option>
      <option value="Fat Loss">Fat Loss</option>
      <option value="Weight Gain">Weight Gain</option>
      <option value="Muscle Gain">Muscle Gain</option>
      <option value="Strength Gain">Strength Gain</option>
    </select>

    <button onclick="saveGoal()">Save Goal</button>
  </div>

  <script>
    function saveGoal() {
      const goal = document.getElementById("goal").value;
      if (!goal) {
        alert("Please select a goal!");
        return;
      }

      let user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        alert("No user found, please register first.");
        window.location.href = "register.html";
        return;
      }

      user.goal = goal;
      localStorage.setItem("user", JSON.stringify(user));

      alert("Your goal has been set to: " + goal);
      window.location.href = "dashboard.html"; // redirect back
    }
  </script>
</body>
</html>
