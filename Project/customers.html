<!DOCTYPE html>
<html>
<head>
    <title>Registered Customers - The Captain Gym</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: black;
            font-family: Verdana, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header{
            background: #111;
            padding: 20px;
            box-shadow: 0px 2px 10px rgba(255,255,255,0.1);
        }
        h1{
            margin: 0;
        }
        table{
            margin: 30px auto;
            border-collapse: collapse;
            width: 85%;
            box-shadow: 0 0 15px rgba(0,255,128,0.5);
            background: #111;
        }
        th, td{
            border: 1px solid #444;
            padding: 12px;
            font-size: 16px;
        }
        th{
            background-color: #222;
            color: lightgreen;
        }
        tr:nth-child(even){
            background-color: #1a1a1a;
        }
        tr:hover{
            background-color: #333;
        }
        button{
            background-color: white;
            border: none;
            color: black;
            padding: 10px 20px;
            font-size: 14px;
            margin: 5px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover{
            background-color: lightgreen;
            transform: scale(1.05);
        }
        .delete-btn{
            background-color: red;
            color: white;
        }
        .delete-btn:hover{
            background-color: darkred;
        }
    </style>
</head>
<body>
    <header>
        <h1>Registered Customers</h1>
    </header>

    <table id="customersTable">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will load here -->
        </tbody>
    </table>

    <button onclick="goBack()">⬅ Back to Home</button>

    <script>
        function loadCustomers(){
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let tableBody = document.querySelector("#customersTable tbody");
            tableBody.innerHTML = "";

            if(users.length === 0){
                let row = `<tr><td colspan="4">No customers registered yet.</td></tr>`;
                tableBody.innerHTML = row;
                return;
            }

            users.forEach((user, index) => {
                let row = `<tr>
                            <td>${user.name}</td>
                            <td>${user.age}</td>
                            <td>${user.email}</td>
                            <td><button class="delete-btn" onclick="deleteCustomer(${index})">Delete</button></td>
                           </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function deleteCustomer(index){
            let users = JSON.parse(localStorage.getItem("users")) || [];
            if(confirm("Are you sure you want to delete this customer?")){
                users.splice(index, 1); // remove user
                localStorage.setItem("users", JSON.stringify(users));
                loadCustomers(); // reload table
            }
        }

        function goBack(){
            window.location.href = "proj1.html";
        }

        // Load customers when page opens
        window.onload = loadCustomers;
    </script>
</body>
</html>
