<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            margin-top: 100px;
        }
        input{
            padding: 10px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid black;
        }
        button{
            padding: 10px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid black;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <input type="text" id="col" placeholder=""><br>
    <button onclick="changebg()">Change Bg</button>
    

    <script>
        function changebg(){
            var color=document.getElementById("col").value;
            document.body.style.background=color;
        }
    </script>
    
</body>
</html>
