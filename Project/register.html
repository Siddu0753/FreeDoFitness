<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FreeDo Fitness</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1558611848-73f7eb4001a1?auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
    }
    .register-box {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      text-align: center;
      backdrop-filter: blur(6px);
      color: #fff;
    }
    h2 {
      margin-bottom: 20px;
      color: #f1c40f;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #e74c3c;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background: #c0392b; }

    /* Gender Selector */
    .gender-container {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }
    .gender-option {
      flex: 1;
      margin: 0 5px;
      position: relative;
    }
    .gender-option input {
      display: none;
    }
    .gender-option label {
      display: block;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      font-weight: bold;
      color: #fff;
    }
    .gender-option input:checked + label {
      background: #e74c3c;
      color: #fff;
      box-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="register-box">
    <h2>Register</h2>
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="number" id="age" placeholder="Age" required>
    <input type="number" id="weight" placeholder="Weight (kg)" required>

    <div class="gender-container">
      <div class="gender-option">
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">♂ Male</label>
      </div>
      <div class="gender-option">
        <input type="radio" id="female" name="gender" value="Female" required>
        <label for="female">♀ Female</label>
      </div>
    </div>

    <button onclick="registerUser()">Register</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>


  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAqjRwVJ5slRrI3dfrGjYS0aUTY0KMJ-90",
  authDomain: "freedo-fitness.firebaseapp.com",
  projectId: "freedo-fitness",
  storageBucket: "freedo-fitness.firebasestorage.app",
  messagingSenderId: "168354809746",
  appId: "1:168354809746:web:6f7437ab65108604b7e34b",
  measurementId: "G-EBH6P3BWQQ"
};

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function registerUser() {
      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;
      const weight = document.getElementById("weight").value;
      const gender = document.querySelector('input[name="gender"]:checked')?.value;

      if (!name || !age || !weight || !gender) {
        alert("Please fill all fields.");
        return;
      }

      try {
        await db.collection("customers").add({
          name,
          age,
          weight,
          gender,
          timestamp: new Date()
        });

        localStorage.setItem("user", JSON.stringify({ name, age, weight, gender }));

        alert("✅ Registration successful!");
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Error saving user:", error);
        alert("❌ Error saving user data.");
      }
    }
  </script>
</body>
</html>
