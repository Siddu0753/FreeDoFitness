<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Plans - FreeDo Fitness</title>
  <style>
   body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1594737625785-c0a5f0d65b3f?auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
  color: #fff;
  min-height: 100vh;   /* ensures full-page background */
}

.overlay {
  position: fixed;   /* make it cover screen always */
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  z-index: 0;        /* stay behind content */
}

.container {
  position: relative;
  z-index: 1;
  max-width: 950px;
  margin: auto;
  padding: 40px;
}


    h1 {
      text-align: center;
      font-size: 34px;
      color: #f1c40f;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #e74c3c;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #c0392b;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      backdrop-filter: blur(6px);
    }

    .day-card h2 {
      color: #e74c3c;
      margin-bottom: 10px;
    }

    .day-card ul {
      list-style: none;
      padding: 0;
    }

    .day-card ul li {
      margin: 6px 0;
      padding: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    .note {
      margin-top: 25px;
      font-size: 15px;
      color: #00e6e6;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Personalized Workout Plan</h1>

    <label for="goal">Select Your Goal</label>
    <select id="goal">
      <option value="">-- Select --</option>
      <option value="muscle">Muscle Gain</option>
      <option value="strength">Strength Gain</option>
      <option value="fatloss">Fat Loss</option>
    </select>
    <button onclick="showPlan()">Get Plan</button>

    <div id="plan"></div>
  </div>

  <script>
    function showPlan() {
      const goal = document.getElementById("goal").value;
      const planDiv = document.getElementById("plan");
      planDiv.innerHTML = "";

      if (!goal) {
        alert("Please select a goal!");
        return;
      }

      let planHTML = "";

      if (goal === "muscle") {
        planHTML = `
          <div class='day-card'><h2>Monday – Chest & Triceps</h2>
          <ul><li>Bench Press – 4x8-12</li><li>Incline Dumbbell Press – 4x8-12</li>
          <li>Chest Flyes – 3x12-15</li><li>Tricep Dips – 4x8-12</li>
          <li>Skull Crushers – 3x10-15</li></ul></div>

          <div class='day-card'><h2>Tuesday – Back & Biceps</h2>
          <ul><li>Pull-Ups – 4x8-12</li><li>Bent Over Rows – 4x8-12</li>
          <li>Lat Pulldowns – 3x10-15</li><li>Barbell Curls – 4x8-12</li></ul></div>

          <div class='day-card'><h2>Wednesday – Legs</h2>
          <ul><li>Squats – 4x8-12</li><li>Leg Press – 4x10-15</li>
          <li>Lunges – 3x12-15</li><li>Leg Curls – 3x12-15</li></ul></div>

          <div class='day-card'><h2>Thursday – Shoulders & Abs</h2>
          <ul><li>Overhead Press – 4x8-12</li><li>Lateral Raises – 4x12-15</li>
          <li>Front Raises – 3x12-15</li><li>Planks – 3 sets</li></ul></div>

          <div class='day-card'><h2>Friday – Chest & Back</h2>
          <ul><li>Incline Bench Press – 4x8-12</li><li>Flat Dumbbell Flyes – 4x10-15</li>
          <li>Deadlifts – 4x6-10</li><li>T-Bar Rows – 3x10-15</li></ul></div>

          <div class='day-card'><h2>Saturday – Arms & Abs</h2>
          <ul><li>Close Grip Bench Press – 4x8-12</li><li>EZ Bar Curls – 4x8-12</li>
          <li>Tricep Kickbacks – 3x12-15</li><li>Russian Twists – 3 sets</li></ul></div>
        `;
      }

      else if (goal === "strength") {
        planHTML = `
          <div class='day-card'><h2>Monday – Heavy Squat</h2>
          <ul><li>Back Squat – 5x5</li><li>Front Squat – 4x6</li>
          <li>Romanian Deadlift – 4x8</li><li>Weighted Plank – 3 sets</li></ul></div>

          <div class='day-card'><h2>Tuesday – Bench Press Focus</h2>
          <ul><li>Bench Press – 5x5</li><li>Incline Bench – 4x6</li>
          <li>Dips – 3x10</li><li>Overhead Press – 4x6</li></ul></div>

          <div class='day-card'><h2>Wednesday – Deadlift</h2>
          <ul><li>Deadlift – 5x5</li><li>Deficit Deadlift – 4x6</li>
          <li>Barbell Row – 4x8</li><li>Pull-Ups – 3 sets</li></ul></div>

          <div class='day-card'><h2>Thursday – Active Recovery</h2>
          <ul><li>Yoga / Stretching</li><li>Light Cardio 20-30 min</li></ul></div>

          <div class='day-card'><h2>Friday – Overhead Press</h2>
          <ul><li>OHP – 5x5</li><li>Push Press – 4x6</li>
          <li>Lateral Raises – 4x12</li><li>Face Pulls – 3x15</li></ul></div>

          <div class='day-card'><h2>Saturday – Full Body Power</h2>
          <ul><li>Clean & Press – 5x5</li><li>Front Squat – 4x6</li>
          <li>Chin-Ups – 4 sets</li><li>Farmer’s Carry – 3x30s</li></ul></div>
        `;
      }

      else if (goal === "fatloss") {
        planHTML = `
          <div class='day-card'><h2>Monday – HIIT + Upper</h2>
          <ul><li>Burpees – 30s</li><li>Push-Ups – 3x15</li><li>Rows – 3x12</li></ul></div>

          <div class='day-card'><h2>Tuesday – Cardio + Core</h2>
          <ul><li>Running – 30 min</li><li>Plank – 3 sets</li><li>Leg Raises – 3x15</li></ul></div>

          <div class='day-card'><h2>Wednesday – Full Body Circuit</h2>
          <ul><li>Squats – 3x15</li><li>Lunges – 3x12</li><li>Mountain Climbers – 30s</li></ul></div>

          <div class='day-card'><h2>Thursday – Active Rest</h2>
          <ul><li>Walking 10,000 steps</li><li>Stretching 15 min</li></ul></div>

          <div class='day-card'><h2>Friday – Strength + HIIT</h2>
          <ul><li>Deadlift – 4x8</li><li>Bench Press – 4x8</li><li>Sprints – 5x100m</li></ul></div>

          <div class='day-card'><h2>Saturday – Long Cardio</h2>
          <ul><li>Jogging / Cycling – 45 min</li><li>Core – 3 exercises</li></ul></div>
        `;
      }

      planHTML += `<div class='note'>
        <p>🔥 Always warm up before workouts</p>
        <p>🔥 Aim for 7–8 hrs of sleep</p>
        <p>🔥 Track progress weekly</p>
      </div>`;

      planDiv.innerHTML = planHTML;
    }
  </script>
</body>
</html>
