<!DOCTYPE html>
<html>
<head>
    <title>FreeDo Fitness</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Verdana, sans-serif;
            text-align: center;
            color: white;

            /* New background with gradient overlay */
            background: linear-gradient(rgba(15, 15, 40, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80')
                        no-repeat center center/cover;

            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1{
            font-size: 3.5em;
            color: #ff4d6d;
            text-shadow: 3px 3px 15px black;
            margin-bottom: 15px;
        }

        p.tagline{
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 2px 2px 8px black;
        }

        .quote{
            font-size: 22px;
            font-style: italic;
            margin: 20px 0;
            color: #00e6e6;
            text-shadow: 2px 2px 12px black;
        }

        button{
            background: linear-gradient(90deg, #ff4d6d, #ffcc00);
            border: none;
            color: black;
            padding: 15px 50px;
            font-size: 18px;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 35px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0px 0px 20px rgba(255, 100, 100, 0.8);
        }

        button:hover{
            transform: scale(1.1);
            box-shadow: 0px 0px 30px rgba(255, 200, 0, 1);
        }
    </style>
</head>
<body>
    <h1>FreeDo Fitness</h1>
    <p class="tagline">Fitness for Everyone • Free & Affordable Plans</p>
    <p class="quote">"Discipline is choosing between what you want now and what you want most."</p>
    <button onclick="goToLogin()">Get Started</button>

    <script>
        function goToLogin(){
            window.location.href = "login.html"; 
        }
    </script>
</body>
</html>
